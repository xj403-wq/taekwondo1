<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 | Admin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI','PingFang SC',sans-serif; background:#f0f2f5; color:#333; line-height:1.5; padding:40px 20px; }
  .box { max-width:800px; margin:0 auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
  h1 { font-size:1.5rem; margin-bottom:20px; color:#1c2b3a; }
  .drop { border:3px dashed #ccc; border-radius:12px; padding:40px; text-align:center; cursor:pointer; transition:0.2s; background:#fafbfc; margin-bottom:20px; }
  .drop:hover { border-color:#e67e22; background:#fef5e7; }
  .drop input { display:none; }
  .input { width:100%; padding:12px 16px; border:1px solid #ccc; border-radius:8px; margin-bottom:20px; font-size:1rem; font-family:inherit; }
  .btn { background:#e67e22; color:#fff; border:none; padding:14px 32px; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; width:100%; font-family:inherit; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .progress-wrap { margin-top:20px; display:none; }
  .progress-bar { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin-bottom:10px; }
  .progress-fill { height:100%; width:0%; background:#e67e22; transition:0.2s; }
  .status { font-size:0.9rem; color:#27ae60; font-weight:600; text-align:center; }
  .media-list { margin-top:30px; border-top:1px solid #eee; padding-top:20px; }
  .media-item { display:flex; align-items:center; justify-content:space-between; padding:10px; border:1px solid #eee; border-radius:8px; margin-bottom:10px; }
  .media-item span { font-size:0.9rem; font-weight:500; }
  .del-btn { background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-family:inherit; }
</style>
</head>
<body>
<div class="box">
  <h1>🎬 视频/图片上传管理</h1>
  
  <div class="drop" onclick="document.getElementById('file').click()">
    <div style="font-size:2rem; margin-bottom:10px;">📁</div>
    <div>点击选择文件，支持上传超大视频 (MP4/WebM)</div>
    <input type="file" id="file" accept="video/*,image/*">
  </div>

  <input type="text" id="title" class="input" placeholder="为媒体添加标题（可选）">
  <button class="btn" id="uploadBtn">🚀 开始分片上传</button>

  <div class="progress-wrap" id="prog">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="media-list" id="list"></div>
</div>

<script>
// 配置分片大小：5MB 一片
const CHUNK_SIZE = 5 * 1024 * 1024; 

document.getElementById('file').addEventListener('change', (e) => {
  if (e.target.files.length) {
    document.getElementById('status').textContent = '已选择: ' + e.target.files[0].name;
    document.getElementById('prog').style.display = 'block';
    document.getElementById('fill').style.width = '0%';
  }
});

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const file = document.getElementById('file').files[0];
  if (!file) return alert('请先选择文件');

  const btn = document.getElementById('uploadBtn');
  const title = document.getElementById('title').value.trim();
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');
  
  btn.disabled = true;
  btn.textContent = '上传中...';
  
  try {
    // 第一步：申请上传 (Vercel Blob 支持客户端直传，不经过服务器函数限制)
    // 如果用 Vercel Blob 客户端 SDK，可以直接上传。
    // 这里的代码假设我们使用 Vercel 的 /api/upload 接口生成 token
    const reqRes = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, contentType: file.type })
    });
    const { uploadUrl, url } = await reqRes.json();

    // 第二步：直接向云端上传文件（PUT 请求）
    status.textContent = '正在上传大文件至云端...';
    
    // 使用 XMLHttpRequest 来获取进度
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', uploadUrl, true);
    xhr.setRequestHeader('Content-Type', file.type);
    
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        fill.style.width = percent + '%';
        status.textContent = `上传中... ${percent}%`;
      }
    };

    xhr.onload = async () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        fill.style.width = '100%';
        status.textContent = '✅ 上传成功！正在保存记录...';
        
        // 第三步：保存记录到数据库
        await fetch('/api/save-media', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, url, type: file.type })
        });

        status.textContent = '✅ 发布成功！前台可见。';
        btn.disabled = false;
        btn.textContent = '🚀 开始分片上传';
        loadList();
      } else {
        status.textContent = '❌ 上传失败';
        btn.disabled = false;
      }
    };
    
    xhr.onerror = () => {
      status.textContent = '❌ 网络错误';
      btn.disabled = false;
    };

    xhr.send(file);

  } catch (err) {
    status.textContent = '❌ 错误: ' + err.message;
    btn.disabled = false;
  }
});

async function loadList() {
  const res = await fetch('/api/media');
  const list = await res.json();
  const container = document.getElementById('list');
  container.innerHTML = '<h3>已上传的媒体</h3>' + list.map(item => 
    `<div class="media-item">
      <span>${item.title || '未命名'} (${item.type})</span>
      <button class="del-btn" onclick="delMedia('${item.url}')">删除</button>
    </div>`
  ).join('');
}

async function delMedia(url) {
  if (!confirm('确定删除吗？')) return;
  await fetch('/api/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  });
  loadList();
}

loadList();
</script>
</body>
</html>
